# Netlify, the fallback to Cloudflare Pages, builds the site from this repository (a private one is fine) and publishes dist-site/.
# Connect the repository once in the Netlify dashboard; it reads this
# file for the rest. See site/README.md. $URL is the site's main address, which Netlify sets at build time.
[build]
  command = "SITE_URL=$URL/ npm run build:site"
  publish = "dist-site"

[build.environment]
  NODE_VERSION = "24"
