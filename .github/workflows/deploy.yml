# Publishes the website (site/) and the web app (src/) to GitHub Pages: the site at the root, the app under app/.
# Run by hand from the Actions tab. GitHub Pages needs a public repository (or a paid GitHub plan) and the source
# is not public yet, so this does not run on push; the site deploys through Netlify (netlify.toml) for now.
# See site/README.md.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running one instead of cutting it off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read where Pages serves this repository
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the site and the app
        run: npm run build:pages
        env:
          # "/parchemin/" for a project site, "/" once a custom domain is set in the Pages settings
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
